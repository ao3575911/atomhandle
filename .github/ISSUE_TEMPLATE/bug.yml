name: Bug
description: Report a defect in atom or atom-log
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `atom version`
      placeholder: "0.1.0"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        atom serve &
        atom claim @you/agent
